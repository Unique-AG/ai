name: 'Setup uv'
description: 'Sets up Python and uv, optionally installs package dependencies'

inputs:
  package_dir:
    description: 'Path to the package directory (required when install_dependencies is true)'
    required: false
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  install_dependencies:
    description: 'Whether to install package dependencies after setting up uv'
    required: false
    default: 'true'
  lock_mode:
    description: 'uv lock mode: locked (default, asserts lock file is up-to-date) or frozen (uses lock file as-is, no staleness check)'
    required: false
    default: 'locked'

outputs:
  uv-version:
    description: 'Installed uv version (from astral-sh/setup-uv)'
    value: ${{ steps.install-uv.outputs.uv-version }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install uv
      id: install-uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: '0.11.28'

    - name: Print versions
      shell: bash
      run: |
        echo "Python version: $(python --version)"
        echo "uv version: $(uv --version)"

    - name: Install dependencies
      if: inputs.install_dependencies == 'true'
      shell: bash
      run: |
        PKG_NAME=$(grep '^name' "${{ inputs.package_dir }}/pyproject.toml" | head -1 | sed 's/.*= *"\(.*\)"/\1/')
        echo "Syncing package: $PKG_NAME"
        uv sync --${{ inputs.lock_mode }} --package "$PKG_NAME"
        uv sync --${{ inputs.lock_mode }} --inexact --only-dev
