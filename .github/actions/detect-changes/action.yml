name: 'Detect Changes'
description: 'Detects which packages changed using dorny/paths-filter. Outputs a JSON blob consumed by select-packages.'

outputs:
  changes:
    description: 'JSON object with package change status (keys = package ids, values = "true"/"false")'
    value: ${{ steps.serialize.outputs.changes }}

runs:
  using: 'composite'
  steps:
    - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
      id: filter
      with:
        predicate-quantifier: 'every'
        # Each `<id>` filter excludes *.md, because markdown is normally docs.
        # A `<id>_skills` filter adds back the markdown that is packaged into
        # the wheel and read at runtime; `serialize` ORs it into `<id>`. Add
        # one for every package that grows a `skills/` directory, otherwise
        # editing a shipped skill silently publishes nothing.
        filters: |
          toolkit:
            - 'unique_toolkit/**'
            - '!unique_toolkit/**/*.md'
            - '!unique_toolkit/**/docs/**'
            - '!unique_toolkit/**/.entangled/**'
            - '!unique_toolkit/**/mkdocs.yaml'
          sdk:
            - 'unique_sdk/**'
            - '!unique_sdk/**/*.md'
          sdk_skills:
            - 'unique_sdk/unique_sdk/**/skills/**'
          mcp:
            - 'unique_mcp/**'
            - '!unique_mcp/**/*.md'
          orchestrator:
            - 'unique_orchestrator/**'
            - '!unique_orchestrator/**/*.md'
          web_search:
            - 'tool_packages/unique_web_search/**'
            - '!tool_packages/unique_web_search/**/*.md'
          web_search_skills:
            - 'tool_packages/unique_web_search/src/**/skills/**'
          swot:
            - 'tool_packages/unique_swot/**'
            - '!tool_packages/unique_swot/**/*.md'
          follow_up_questions:
            - 'postprocessors/unique_follow_up_questions/**'
            - '!postprocessors/unique_follow_up_questions/**/*.md'
          stock_ticker:
            - 'postprocessors/unique_stock_ticker/**'
            - '!postprocessors/unique_stock_ticker/**/*.md'
          user_memory:
            - 'postprocessors/unique_user_memory/**'
            - '!postprocessors/unique_user_memory/**/*.md'
          deep_research:
            - 'tool_packages/unique_deep_research/**'
            - '!tool_packages/unique_deep_research/**/*.md'
          internal_search:
            - 'tool_packages/unique_internal_search/**'
            - '!tool_packages/unique_internal_search/**/*.md'
          skill_tool:
            - 'tool_packages/unique_skill_tool/**'
            - '!tool_packages/unique_skill_tool/**/*.md'
          quartr:
            - 'connectors/unique_quartr/**'
            - '!connectors/unique_quartr/**/*.md'
          six:
            - 'connectors/unique_six/**'
            - '!connectors/unique_six/**/*.md'
          search_proxy:
            - 'connectors/unique_search_proxy/**'
            - '!connectors/unique_search_proxy/**/*.md'
          search_proxy_core:
            - 'connectors/unique_search_proxy/unique_search_proxy_core/**'
            - '!connectors/unique_search_proxy/unique_search_proxy_core/**/*.md'
          search_proxy_sdk:
            - 'connectors/unique_search_proxy/unique_search_proxy_sdk/**'
            - '!connectors/unique_search_proxy/unique_search_proxy_sdk/**/*.md'
          uqadm:
            - 'uqadm/**'
            - '!uqadm/**/*.md'
    - id: serialize
      shell: bash
      run: |
        CHANGES_JSON='${{ toJson(steps.filter.outputs) }}'
        # paths-filter also emits a `changes` array of matched filter names.
        # Nothing consumes it, and after the fold it would still name the
        # `_skills` helpers, so drop it and keep the output a pure id -> bool map.
        MERGED=$(jq -c '
          reduce (keys[] | select(endswith("_skills"))) as $helper (.;
            ($helper | rtrimstr("_skills")) as $pkg
            | (if .[$helper] == "true" then .[$pkg] = "true" else . end)
            | del(.[$helper])
          )
          | del(.changes)
        ' <<<"$CHANGES_JSON")
        echo "changes=$MERGED" >> $GITHUB_OUTPUT
        echo "$MERGED" | jq .
