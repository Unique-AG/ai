# Keeps GitHub Actions used in workflows and composite actions up to date.
# Dependabot preserves the existing SHA-pin + version-comment style enforced
# by .github/workflows/github.policies.verify.pinned-actions.yaml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    # 2-week stability window: skip releases newer than this. github-actions is
    # not semver-graded by Dependabot, so default-days governs all bumps.
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  # Keeps container images in Dockerfiles up to date. Without this, the digest
  # pins in the shipped images never move and a pinned base silently ages.
  # Friday cadence matches the docker-base rebuilds in the platform monorepo,
  # so base and consumer patches land in one review window.
  - package-ecosystem: docker
    directories:
      - "**/*"
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - docker
    groups:
      docker:
        patterns:
          - "*"
