name: "[CI] GitHub Actions"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/actions/container-image-vuln-gate/**"
      - ".github/actions/pull-request-labels/**"
      - ".github/workflows/ci-github-actions.yaml"

permissions:
  contents: read

concurrency:
  group: ci-github-actions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test composite actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Run action unit tests
        run: node --test .github/actions/container-image-vuln-gate/*.test.mjs .github/actions/pull-request-labels/*.test.mjs
