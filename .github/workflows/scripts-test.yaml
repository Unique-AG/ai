name: "[chore] Test CI Scripts"

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scripts-test.yaml"
      - ".github/actions/get-packages-matrix/package_configuration.json"
      - ".github/actions/container-image-vuln-gate/**"
      - ".github/actions/pull-request-labels/**"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scripts-test.yaml"
      - ".github/actions/get-packages-matrix/package_configuration.json"
      - ".github/actions/container-image-vuln-gate/**"
      - ".github/actions/pull-request-labels/**"

jobs:
  test-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run BATS tests
        run: |
          bats .github/scripts/tests/*.bats --tap

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.28'

      - name: Run Python unit tests
        run: |
          # Resolver tests need only stdlib; rewriter tests need tomlkit.
          # One venv for both keeps the step simple.
          uv run --quiet --no-project --with 'tomlkit==0.14.0' -- \
            python3 -m unittest discover \
              --start-directory .github/scripts/tests \
              --pattern 'test_*.py' \
              --verbose

  test-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Run composite action unit tests
        run: node --test .github/actions/container-image-vuln-gate/*.test.mjs .github/actions/pull-request-labels/*.test.mjs
