name: "[chore] Test CI Scripts"

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scripts-test.yaml"
      - ".github/actions/get-packages-matrix/package_configuration.json"
      - ".github/actions/container-image-vuln-gate/**"
      - ".github/actions/pull-request-labels/**"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scripts-test.yaml"
      - ".github/actions/get-packages-matrix/package_configuration.json"
      - ".github/actions/container-image-vuln-gate/**"
      - ".github/actions/pull-request-labels/**"

jobs:
  test-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run BATS tests
        run: |
          bats .github/scripts/tests/*.bats --tap

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.28'

      - name: Run Python unit tests
        run: |
          # Resolver tests need only stdlib; rewriter tests need tomlkit.
          # One venv for both keeps the step simple.
          uv run --quiet --no-project --with 'tomlkit==0.14.0' -- \
            python3 -m unittest discover \
              --start-directory .github/scripts/tests \
              --pattern 'test_*.py' \
              --verbose

  test-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Run composite action unit tests
        run: node --test .github/actions/container-image-vuln-gate/*.test.mjs .github/actions/pull-request-labels/*.test.mjs
