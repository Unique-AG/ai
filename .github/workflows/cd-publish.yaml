name: "[CD] Publish to PyPI"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (required for manual dispatch)"
        type: choice
        options:
          - ""
          - all
          - sdk
          - toolkit
          - mcp
          - orchestrator
          - web_search
          - swot
          - follow_up_questions
          - stock_ticker
          - user_memory
          - deep_research
          - internal_search
          - quartr
          - six
          - search_proxy
          - search_proxy_core
          - search_proxy_sdk
          - skill_tool
        default: ""
      ref:
        description: "Release tag to retry (e.g. unique-sdk-v2026.30.0). Defaults to github.sha, which only publishes if that ref carries an unreleased version."
        required: false
        default: ""

jobs:
  resolve-package:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      publish_sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # The publish job runs code from this commit with id-token: write
      # (PyPI Trusted Publishing). The environment's ref policy only checks
      # the ref the workflow was dispatched from, not inputs.ref, so only
      # release tags on main or release/* are accepted here. The publish job
      # checks out the resolved SHA, so the tag can't be moved in between.
      - name: Validate ref to publish
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            REF="$RELEASE_TAG"
          elif [[ -n "$INPUT_REF" ]]; then
            REF="$INPUT_REF"
          else
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$REF" =~ ^(unique-[a-z0-9-]+|uqadm)-v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "Error: ref '$REF' is not a release tag like 'unique-sdk-v2026.30.0'." >&2
            exit 1
          fi
          if ! SHA="$(git rev-parse --verify --quiet "refs/tags/$REF^{commit}")"; then
            echo "Error: tag '$REF' does not exist." >&2
            exit 1
          fi

          ON_RELEASE_LINE=false
          while read -r BRANCH; do
            if git merge-base --is-ancestor "$SHA" "$BRANCH"; then
              ON_RELEASE_LINE=true
              break
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/main 'refs/remotes/origin/release/*')
          if [[ "$ON_RELEASE_LINE" != true ]]; then
            echo "Error: tag '$REF' ($SHA) is not on main or a release/* branch." >&2
            exit 1
          fi

          echo "Publishing from $REF ($SHA)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/get-packages-matrix
        id: pkgs

      - name: Filter publishable packages
        id: filter
        run: |
          PACKAGES='${{ steps.pkgs.outputs.packages }}'
          FILTERED=$(echo "$PACKAGES" | jq -c '[.[] | select((.publish_skip != true) and (.pypi_name != null))]')
          echo "packages=$FILTERED" >> $GITHUB_OUTPUT

      - name: Resolve packages to publish
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          PACKAGES='${{ steps.filter.outputs.packages }}'

          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="$RELEASE_TAG"
            # Tag format: <component>-v<version>, e.g. unique-toolkit-v2026.18.0
            COMPONENT="${TAG%-v*}"

            # Map component to package config using release-please-config.json
            PKG_DIR=$(jq -r --arg comp "$COMPONENT" \
              '.packages | to_entries[] | select(.value.component == $comp) | .key' \
              release-please-config.json)

            if [[ -z "$PKG_DIR" || "$PKG_DIR" == "null" ]]; then
              echo "Error: no package found for component '$COMPONENT' (tag: $TAG)"
              exit 1
            fi

            MATRIX=$(echo "$PACKAGES" | jq -c --arg dir "$PKG_DIR" \
              '{include: [.[] | select(.dir == $dir)]}')
          elif [[ -n "$INPUT_PACKAGE" && "$INPUT_PACKAGE" != "" ]]; then
            SELECTED="$INPUT_PACKAGE"
            if [[ "$SELECTED" == "all" ]]; then
              MATRIX=$(echo "$PACKAGES" | jq -c '{include: .}')
            else
              MATRIX=$(echo "$PACKAGES" | jq -c --arg id "$SELECTED" \
                '{include: [.[] | select(.id == $id)]}')
            fi
          else
            echo "Error: no package specified and not triggered by release event"
            exit 1
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Publishing: $(echo "$MATRIX" | jq -r '.include[].id // empty')"

  build:
    needs: resolve-package
    if: ${{ fromJson(needs.resolve-package.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-package.outputs.matrix) }}
    name: build-${{ matrix.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-package.outputs.publish_sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'

      - name: Build package
        working-directory: ${{ matrix.dir }}
        env:
          UV_NO_SOURCES: 1
        run: uv build -o dist

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.id }}
          path: ${{ matrix.dir }}/dist/
          if-no-files-found: error
          retention-days: 1

  # Only this job can request a PyPI OIDC token. It runs no repository or
  # build code: it downloads the distributions built above and uploads them.
  publish:
    needs: [resolve-package, build]
    if: ${{ !cancelled() && needs.resolve-package.result == 'success' && needs.build.result != 'skipped' && fromJson(needs.resolve-package.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC), no stored token
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-package.outputs.matrix) }}
    name: publish-${{ matrix.id }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.id }}
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: false

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  containerize:
    needs: [resolve-package, publish]
    # release-only: a manual workflow_dispatch has no release tag to derive the
    # image version from, so containerization runs solely on release events.
    if: needs.publish.result == 'success' && github.event_name == 'release'
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing in cd-containerize.yaml
      security-events: write # Trivy SARIF upload in cd-containerize.yaml
    uses: ./.github/workflows/cd-containerize-batch.yaml
    secrets: inherit
    with:
      publish_matrix: ${{ needs.resolve-package.outputs.matrix }}
      release_tag: ${{ github.event.release.tag_name }}
      tag_latest: true
      ref: ${{ github.event.release.tag_name }}

  helm-publish:
    # release-only: stable charts are bumped by release-please at the
    # `# x-release-please-version` markers, so no version is stamped here — the
    # chart is packaged as checked out at the release tag. Runs after
    # containerize so the chart's image.tag resolves to a pushed image.
    needs: [resolve-package, containerize]
    if: needs.containerize.result == 'success' && github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/cd-helm-publish-batch.yaml
    secrets: inherit
    with:
      publish_matrix: ${{ needs.resolve-package.outputs.matrix }}
      release_tag: ${{ github.event.release.tag_name }}

  uniquecr-copy:
    needs: [helm-publish]
    if: >-
      needs.helm-publish.result == 'success'
      && github.event_name == 'release'
      && github.event.release.prerelease == false
      && startsWith(github.event.release.tag_name, 'unique-search-proxy-v')
    permissions:
      contents: read
      id-token: write # Azure OIDC login and keyless cosign signing in cd-uniquecr-search-proxy.yaml
    uses: ./.github/workflows/cd-uniquecr-search-proxy.yaml
    with:
      release_tag: ${{ github.event.release.tag_name }}
