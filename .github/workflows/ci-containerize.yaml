name: "[CI] Containerize"

on:
  workflow_call:
    inputs:
      changes:
        description: 'Pre-computed changes JSON from ci.yaml (skips detection when set)'
        required: false
        type: string
        default: ''
      matrix:
        description: 'Pre-computed matrix JSON from ci.yaml (skips select-packages when set)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to containerize (leave empty for auto-detect based on changes)'
        type: choice
        options:
          - ''
          - all
          - search_proxy
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: inputs.matrix == ''
        with:
          persist-credentials: false

      - uses: ./.github/actions/detect-changes
        if: inputs.matrix == ''
        id: detect

      - uses: ./.github/actions/get-packages-matrix
        if: inputs.matrix == ''
        id: pkgs

      - name: Select packages
        if: inputs.matrix == ''
        id: select
        uses: ./.github/actions/select-packages
        with:
          packages: ${{ steps.pkgs.outputs.packages }}
          selected: ${{ github.event.inputs.package }}
          changes: ${{ inputs.changes || steps.detect.outputs.changes }}

      - name: Filter containerized packages
        id: filter
        env:
          RAW_MATRIX: ${{ inputs.matrix || steps.select.outputs.matrix }}
        run: |
          MATRIX=$(jq -c '{include: [.include[]? | select(.containerize == true)]}' <<<"$RAW_MATRIX")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  containerize:
    needs: prepare
    if: fromJson(needs.prepare.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: containerize-${{ matrix.id }}
    env:
      GHCR_REPO: ${{ matrix.container_repo }}
      SERVICE_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Resolve image tar path
        id: image-tar
        run: echo "path=${RUNNER_TEMP}/${SERVICE_ID}.tar" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image (no push)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ${{ matrix.dir }}/deploy/Dockerfile
          platforms: linux/amd64
          push: false
          pull: true
          provenance: false
          tags: ${{ env.GHCR_REPO }}:ci
          no-cache-filters: runtime
          cache-from: type=registry,ref=${{ env.GHCR_REPO }}:cache
          outputs: type=docker,dest=${{ steps.image-tar.outputs.path }}

      - name: Scan the image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          scan-type: image
          input: ${{ steps.image-tar.outputs.path }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
          timeout: 20m
          cache: true

      - name: Report the findings
        if: hashFiles('trivy-results.json') != ''
        continue-on-error: true
        run: |
          trivy convert --format template \
            --template @.github/trivy-templates/image-summary-markdown.tpl \
            trivy-results.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '.Results[]?.Vulnerabilities[]? | "::warning title=Image finding::\(.PkgName) \(.InstalledVersion) → \(.FixedVersion) \(.VulnerabilityID) (\(.Severity))"' trivy-results.json
