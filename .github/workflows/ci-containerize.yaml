name: "[CI] Containerize"

on:
  workflow_call:
    inputs:
      changes:
        description: 'Pre-computed changes JSON from ci.yaml (skips detection when set)'
        required: false
        type: string
        default: ''
      matrix:
        description: 'Pre-computed matrix JSON from ci.yaml (skips select-packages when set)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to containerize (leave empty for auto-detect based on changes)'
        type: choice
        options:
          - ''
          - all
          - search_proxy
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/detect-changes
        if: inputs.matrix == ''
        id: detect

      # The package filters in detect-changes miss the shared lockfile and the gate itself.
      - name: Detect shared image inputs
        if: github.event_name != 'workflow_dispatch'
        id: shared
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            image_inputs:
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/actions/container-image-vuln-gate/**'
              - '.github/actions/pull-request-labels/**'
              - '.github/workflows/ci-containerize.yaml'

      - uses: ./.github/actions/get-packages-matrix
        id: pkgs

      - name: Select packages
        if: inputs.matrix == ''
        id: select
        uses: ./.github/actions/select-packages
        with:
          packages: ${{ steps.pkgs.outputs.packages }}
          selected: ${{ github.event.inputs.package }}
          changes: ${{ inputs.changes || steps.detect.outputs.changes }}

      - name: Filter containerized packages
        id: filter
        env:
          RAW_MATRIX: ${{ inputs.matrix || steps.select.outputs.matrix }}
          PACKAGES: ${{ steps.pkgs.outputs.packages }}
          SHARED_INPUTS_CHANGED: ${{ steps.shared.outputs.image_inputs }}
        run: |
          if [ "$SHARED_INPUTS_CHANGED" = "true" ]; then
            MATRIX=$(jq -c '{include: [.[] | select(.containerize == true)]}' <<<"$PACKAGES")
          else
            MATRIX=$(jq -c '{include: [.include[]? | select(.containerize == true)]}' <<<"$RAW_MATRIX")
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  containerize:
    needs: prepare
    if: fromJson(needs.prepare.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      pull-requests: read # live security-exception label lookup in the vuln gate
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: containerize-${{ matrix.id }}
    env:
      GHCR_REPO: ${{ matrix.container_repo }}
      SERVICE_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Resolve image tar path
        id: image-tar
        run: echo "path=${RUNNER_TEMP}/${SERVICE_ID}.tar" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image (no push)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ${{ matrix.dir }}/deploy/Dockerfile
          platforms: linux/amd64
          push: false
          pull: true
          provenance: false
          tags: ${{ env.GHCR_REPO }}:ci
          no-cache-filters: runtime
          cache-from: type=registry,ref=${{ env.GHCR_REPO }}:cache
          outputs: type=docker,dest=${{ steps.image-tar.outputs.path }}

      # Release PRs only report, so a search-proxy finding doesn't hold every package's release.
      - name: Vulnerability gate
        id: vuln-gate
        uses: ./.github/actions/container-image-vuln-gate
        continue-on-error: ${{ github.event.pull_request.user.login == 'gh-release-workflow[bot]' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--') }}
        with:
          image_tar: ${{ steps.image-tar.outputs.path }}
          docker_dockerfile_path: ${{ matrix.dir }}/deploy/Dockerfile

      - name: Report gate findings on release PRs
        if: steps.vuln-gate.outcome == 'failure'
        run: echo "::warning title=Vulnerability gate::Release PR, so blocking findings are reported only. See the job summary."
