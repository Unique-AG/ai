name: "[Security] Trivy Image Scan"

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      package:
        description: Package to scan
        type: choice
        options:
          - all
          - search_proxy
        default: all
      source:
        description: "build: build the selected branch and scan it. release: scan a published image."
        type: choice
        options:
          - build
          - release
        default: build
      release_tag:
        description: "Release tag or version to scan when source is release, for example YYYY.WW.X, YYYY.WW.XrcN or YYYY.WW.X.devN. Empty means the latest stable release."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: security-trivy-registry
  cancel-in-progress: false

jobs:
  detect-packages:
    name: Detect containerized packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.build-matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build package matrix
        id: build-matrix
        env:
          REQUESTED: ${{ inputs.package || 'all' }}
        run: |
          set -euo pipefail
          packages=$(jq -c --arg requested "$REQUESTED" '
            $rp[0].packages as $rp_packages
            | [ .[]
                | select(.containerize == true)
                | select($requested == "all" or .id == $requested)
                | {
                    id: .id,
                    image: .container_repo,
                    dir: .dir,
                    tag_base: ($rp_packages[.dir].component + "-v")
                  }
              ]
          ' --slurpfile rp release-please-config.json .github/actions/get-packages-matrix/package_configuration.json)

          if [ "$(jq 'length' <<<"$packages")" -eq 0 ]; then
            echo "::error::No containerized packages selected."
            exit 1
          fi
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

  scan:
    name: Image ${{ matrix.package.id }}
    needs: detect-packages
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-packages.outputs.packages) }}
    permissions:
      contents: read
      packages: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ matrix.package.image }}
      SOURCE: ${{ inputs.source || 'build' }}
      IMAGE_TAR: scan-image.tar
      TRIVY_DISABLE_VEX_NOTICE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release info
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_BASE: ${{ matrix.package.tag_base }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tags=$(gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/${TAG_BASE}" -q '.[].ref | ltrimstr("refs/tags/")' \
            | { grep -E "^${TAG_BASE}[0-9]+\.[0-9]+\.[0-9]+$" || true; } | sort -V)
          if [ -z "$tags" ] && [ "$SOURCE" = release ]; then
            echo "::error::No stable release tags found for ${TAG_BASE}."
            exit 1
          fi
          latest="${tags##*$'\n'}"

          if [ "$SOURCE" = release ]; then
            version="${RELEASE_TAG:-$latest}"
            version="${version#"$TAG_BASE"}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+|\.dev[0-9]+)?$ ]]; then
              echo "::error::release_tag must look like YYYY.WW.X, YYYY.WW.XrcN or YYYY.WW.X.devN (optionally with the ${TAG_BASE} prefix)."
              exit 1
            fi
            label="${IMAGE}:${version}"
          else
            version=""
            label="${IMAGE} built from ${GITHUB_REF_NAME} ${GITHUB_SHA:0:7}"
          fi

          {
            last_scheduled=$({ grep -E '\.0$' <<<"$tags" || true; } | tail -n1)
            if [ -n "$last_scheduled" ] && published=$(gh release view "$last_scheduled" --json publishedAt -q .publishedAt); then
              next=$(date -u -d "${published} +14 days" +%F)
              days=$(( ($(date -u -d "$next" +%s) - $(date -u -d "$(date -u +%F)" +%s)) / 86400 ))
              if [ "$days" -ge 0 ]; then
                echo "**Next scheduled release in ${days} days** (${next})."
              else
                echo "**Next scheduled release is overdue by $((-days)) days** (expected ${next})."
              fi
              echo
            fi
            echo "Scanned: ${label}"
            if [ "$SOURCE" = build ]; then
              echo
              echo "The deployed image is not checked. Run this workflow with source=release to scan it${latest:+ (latest stable: ${latest#"$TAG_BASE"})}."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "label=${label}" >> "$GITHUB_OUTPUT"

      - name: Setup docker buildx
        if: env.SOURCE == 'build'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container image (no push)
        if: env.SOURCE == 'build'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.package.dir }}/deploy/Dockerfile
          platforms: linux/amd64
          push: false
          pull: true
          provenance: false
          tags: ${{ env.IMAGE }}:scan
          no-cache-filters: runtime
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          outputs: type=docker,dest=${{ env.IMAGE_TAR }}

      - name: Resolve published digest
        id: resolve
        if: env.SOURCE == 'release'
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          set -euo pipefail
          if ! digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}'); then
            echo "::error::Could not resolve published image ${IMAGE}:${VERSION}. The image was not scanned."
            exit 1
          fi
          echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ steps.resolve.outputs.ref }}
          input: ${{ env.SOURCE == 'build' && env.IMAGE_TAR || '' }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true
          trivyignores: .github/trivyignore.yaml
          exit-code: "0"
          timeout: 15m
          cache: true

      - name: Convert Trivy results to SARIF
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && hashFiles('trivy-results.json') != ''
        run: trivy convert --format sarif trivy-results.json -o trivy-image-scan-results.sarif

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && hashFiles('trivy-image-scan-results.sarif') != ''
        with:
          sarif_file: trivy-image-scan-results.sarif
          category: ${{ env.SOURCE == 'release' && 'trivy-image-release' || 'trivy-image' }}/${{ matrix.package.id }}

      - name: Evaluate image findings
        env:
          SUMMARY_TEMPLATE: .github/trivy-templates/image-summary-markdown.tpl
          SCAN_LABEL: ${{ steps.info.outputs.label }}
        run: |
          set -euo pipefail
          if [ ! -s trivy-results.json ]; then
            echo "No trivy results file. Treating as clean."
            echo "✅ ${SCAN_LABEL} reports no CRITICAL,HIGH findings." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -f "$SUMMARY_TEMPLATE" ]; then
            trivy convert --format template --template @"$SUMMARY_TEMPLATE" trivy-results.json > trivy-report.md || true
            if [ -s trivy-report.md ]; then
              cat trivy-report.md >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          fixable_json=$(jq -c '[.Results[]?.Vulnerabilities[]? | select(.FixedVersion != null and .FixedVersion != "")]' trivy-results.json)
          fixable_count=$(echo "$fixable_json" | jq 'length')
          echo "Fixable CRITICAL,HIGH in ${SCAN_LABEL}: ${fixable_count}"
          if [ "$fixable_count" -eq 0 ]; then
            echo "✅ ${SCAN_LABEL} reports no patchable CRITICAL,HIGH findings." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$fixable_json" | jq -r '.[] | "::error title=Patchable finding::\(.PkgName) \(.InstalledVersion) → \(.FixedVersion) \(.VulnerabilityID) (\(.Severity))"'
          echo "::error::Patchable CRITICAL,HIGH findings: ${fixable_count} in ${SCAN_LABEL}. Rebuild and release this package."
          exit 1
