# Declared secrets for account-review MCP (deploy + optional Zitadel).
# Values live in 1Password via SecretSpec — nothing sensitive is committed here.
#
# Setup (once, on your machine — not by the agent):
#   1. Install secretspec (nix / https://secretspec.dev) and ensure `op` works
#      with 1Password desktop CLI integration.
#   2. Edit [providers].onepassword if your vault name differs from Private.
#   3. secretspec check --profile deploy
#   4. secretspec set <NAME> --profile deploy   # for each required key below
#   5. ./deploy-with-secrets.sh
#
# Suggested shared values (lab / mcp_search RG):
#   AZURE_RESOURCE_GROUP=rg-lab-demo-001-unique-search-mcp
#   AZURE_LOCATION=swedencentral
#   AZURE_WEBAPP_NAME=account-review-mcp
#   AZURE_CONTAINER_REGISTRY=accountreviewmcpacr

[project]
name = "account-review-mcp"
revision = "1.0"

[providers]
# Change the vault segment to match your 1Password vault title.
onepassword = "onepassword://Private"

[profiles.default]
# Local / live-local: no Azure secrets required.
AUTH_DISABLED = { description = "Skip Zitadel OIDC for local demos", required = false, default = "true" }

[profiles.deploy]
AZURE_SUBSCRIPTION_ID = { description = "Azure subscription id for ACR / App Service deploy", required = true, providers = ["onepassword"] }
AZURE_RESOURCE_GROUP = { description = "Azure resource group for ACR / App Service (must already exist)", required = true, providers = ["onepassword"] }
AZURE_LOCATION = { description = "Azure region for App Service plan / ACR (e.g. swedencentral)", required = true, providers = ["onepassword"] }
AZURE_WEBAPP_NAME = { description = "Azure Web App name (hostname prefix *.azurewebsites.net)", required = true, providers = ["onepassword"] }
AZURE_CONTAINER_REGISTRY = { description = "Azure Container Registry name (no .azurecr.io suffix)", required = true, providers = ["onepassword"] }
ZITADEL_BASE_URL = { description = "Zitadel issuer base URL (e.g. https://id.unique.app)", required = false, providers = ["onepassword"] }
ZITADEL_CLIENT_ID = { description = "Zitadel OIDC client id for this MCP", required = false, providers = ["onepassword"] }
ZITADEL_CLIENT_SECRET = { description = "Zitadel OIDC client secret for this MCP", required = false, providers = ["onepassword"] }
AUTH_DISABLED = { description = "Set true to skip Zitadel on Azure (lab only)", required = false, providers = ["onepassword"] }
