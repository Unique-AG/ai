[project]
name = "risk-database-mcp"
version = "0.1.0"
description = "MCP server that exposes read-only query tools over a bundled Excel risk database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0,<4",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "py-key-value-aio[postgresql]>=0.4.0",
    "requests>=2.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[dependency-groups]
dev = []
