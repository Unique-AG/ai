changesDir: .changelog
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
componentFormat: '### {{.Component}}'
kindFormat: '#### {{.Kind}}'
changeFormat: '- AUDIENCE_{{.Custom.Audience | upper}}: {{.Body}}'
fragmentFileFormat: '{{.Kind | lower}}-{{.Component | replace " " "-" | replace "/" "-" | lower}}-{{.Time.Format "20060102-150405"}}'
kinds:
  - label: Added
  - label: Changed
  - label: Fixed
  - label: Removed
  - label: Security
components:
  - Connectors
  - MCP
  - Orchestrator
  - Postprocessors
  - SDK
  - Tools
  - Toolkit
  - uqadm
custom:
  - key: Audience
    label: Who is this change relevant for
    type: enum
    enumOptions:
      - developer
      - user
      - admin
      - operator
  - key: Ticket
    label: Related Jira ticket(s), e.g. UN-12345 (comma-separate for multiple)
    type: string
    optional: true
newlines:
  afterChangelogHeader: 1
  beforeChangelogVersion: 1
  beforeComponent: 1
  afterChange: 0
