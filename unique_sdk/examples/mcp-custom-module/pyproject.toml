[project]
name = "mcp-custom-module"
version = "0.1.0"
description = "Example external module that calls the MCP tools configured on a Unique space."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "unique-toolkit[fastapi]>=2026.40.0",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
unique-toolkit = { path = "../../../unique_toolkit", editable = true }

[tool.uv.exclude-newer-package]
"unique-toolkit" = false
