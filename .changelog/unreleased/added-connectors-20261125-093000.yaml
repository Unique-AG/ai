component: Connectors
kind: Added
body: >-
  Search Proxy can use Firecrawl as a search engine (`engine: firecrawl` on
  `POST /v1/search`). A search returns titles and previews and costs 2 Firecrawl
  credits per 10 results. Previews follow the query by default (`highlights`)
  and can be as long as a whole table. `scrapeResults` also returns the result
  pages as Markdown from the same call, from a cached copy at most
  `maxCacheAgeSeconds` old (default ten minutes) and capped at `maxPdfPages`
  (default 10) pages per PDF.
  Further options: `sources` (`web`, `news` or `web_and_news`), `category`,
  `timeFilter`, `sortByDate`, `safeSearch`, `country`, `location`, and include
  and exclude domains. It uses the existing Firecrawl credentials
  (`FIRECRAWL_API_KEY`, Helm `firecrawl.connection.apiKey`). Zero data
  retention is set with `FIRECRAWL_ZERO_DATA_RETENTION` (Helm
  `firecrawl.connection.zeroDataRetention`): `none` by default, `anon` or
  `zdr`. A request can raise the mode with `zeroDataRetention` but never lower
  it. Firecrawl must enable the mode for the account first; until then every
  search with that mode fails.
