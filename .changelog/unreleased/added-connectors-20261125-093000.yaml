component: Connectors
kind: Added
body: >-
  Search Proxy can use Firecrawl as a search engine (`engine: firecrawl`). A
  search returns titles and query-matched previews. `FIRECRAWL_ZERO_DATA_RETENTION`
  (`none`, `anon` or `zdr`; Helm `firecrawl.connection.zeroDataRetention`) sets
  zero data retention for Firecrawl searches and page reads.
