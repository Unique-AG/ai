component: Connectors
kind: Fixed
body: >-
  The Firecrawl crawler on Search Proxy now matches each page of a multi-URL read
  to its URL by Firecrawl's `metadata.sourceURL`. Firecrawl returns batch results
  in the order the pages finish, so a page's text could be returned under another
  page's URL.
