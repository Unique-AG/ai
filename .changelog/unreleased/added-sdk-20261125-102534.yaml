component: SDK
kind: Added
body: '`unique_sdk.ProjectMemory` methods (`retrieve`, `modify`, `delete` and their `_async` variants) take a keyword-only `service_id`, sent as the `x-service-id` header. The project memory endpoint is service-only: callers pass `service_id="assistants-core"` and the project owner''s `user_id` and `company_id`; calls without it get 403.'
