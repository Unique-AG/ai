component: Orchestrator
kind: Fixed
body: Spaces with many skills now load every skill on each turn. Before, all skill files were downloaded at once, and a download that timed out silently dropped that skill for the turn. Downloads now share a limit of 10 at a time across all turns, wait up to 20 seconds and are retried once. Once per turn the orchestrator asks the platform which skills the user can read in the space and when each skill file last changed. A skill on that list is parsed once and then kept in memory, so later turns download only new or edited skills. A skill that is not on the list is downloaded as the user on every turn. The in-memory part needs a platform version that serves `GET /space/{spaceId}/skills`; on an older platform every skill is downloaded, with the new limit and retry.
time: 2026-11-25T22:25:00.000000+01:00
