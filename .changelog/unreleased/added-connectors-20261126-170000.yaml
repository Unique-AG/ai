component: Connectors
kind: Added
body: >-
  The Firecrawl crawler on Search Proxy follows `FIRECRAWL_ZERO_DATA_RETENTION`
  (Helm `firecrawl.connection.zeroDataRetention`), the same setting as Firecrawl
  search: `anon` or `zdr` send Firecrawl `zeroDataRetention: true` with every
  page read. `none` (the default) sends nothing. A crawler configuration can
  turn it on for its own reads with `zeroDataRetention`, but never off. New
  crawler options: `maxCacheAgeSeconds`, `storeInCache`, `maxPdfPages`,
  `pdfMode`, `country`, `languages` and `skipTlsVerification`. Three defaults
  change for existing Firecrawl readers: cached pages may be at most ten minutes
  old (before: Firecrawl's default of two days), at most 20 pages of each PDF
  are read (before: the whole document, one credit per page), and the timeout
  is 60 seconds (before: 30). For the old behaviour set `maxCacheAgeSeconds` to
  172800 and `maxPdfPages` to 10000, Firecrawl's maximum. The millisecond
  `maxAge` is hidden in the form; a stored value still applies until the new
  field is saved.
