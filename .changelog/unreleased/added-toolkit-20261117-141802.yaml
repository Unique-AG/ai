component: Toolkit
kind: Added
body: Experimental RabbitMQ sender for the Activity Records outbox, configured with `AMQP_URL`, or `AMQP_HOST` with `AMQP_USERNAME` and `AMQP_PASSWORD`, plus a logging sender for testing. The new `activity-records-amqp` extra installs aio-pika. The sender declares the ingest queue and its dead letter queue like the Node services, so a publish to the default exchange does not fail as unroutable before the consumer has started.
