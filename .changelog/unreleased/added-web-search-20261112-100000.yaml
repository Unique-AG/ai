component: Web Search
kind: Added
body: '`DECOMMISSIONED_SEARCH_ENGINES` (JSON list, default `[]`) switches off a search engine without breaking spaces that use it. Their configs still load, but every search answers that the engine has been decommissioned and an administrator needs to select another one. New spaces default to the first active engine that is not decommissioned.'
