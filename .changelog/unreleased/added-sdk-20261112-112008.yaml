body: '`unique-cli search` takes further queries with `-q` and runs up to 8 in one call concurrently. A chunk found by several queries is shown once, and the output stops at about 100,000 tokens, taking the best results of every query first. A single query behaves as before. In an agent turn, `unique-cli search` refuses after 100 calls; `UNIQUE_CLI_SEARCH_MAX_CALLS_PER_TURN` changes the cap.'
