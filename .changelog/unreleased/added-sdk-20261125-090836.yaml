component: SDK
kind: Added
body: '`unique-cli web-search search` asks the user to approve queries before searching when the chat''s space has web search query review on (`queryElicitationConfig.enableElicitation` on the WebSearch tool; off unless that space sets it to true). A pending review tells the agent to run `unique-cli elicit wait`, then search again with `--review-id`. Spaces with review off, and searches without a chat id, are unchanged.'
