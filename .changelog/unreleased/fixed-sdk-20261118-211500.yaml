component: SDK
kind: Fixed
body: 'An MCP tool result that holds its records in lists under its own keys, such as `{"files": [...]}` or `{"sections": [...], "section_groups": [...]}`, now yields one cited reference per titled record instead of one untitled reference with no link. Records with no title are skipped, and a result with no titled record still yields one untitled reference. A record is linked only when it carries an http(s) link: `webLink`/`web_link` is taken before other URLs such as a meeting join link, and a record whose own web link is empty gets no link rather than an unrelated URL. `display_name` now titles a record.'
