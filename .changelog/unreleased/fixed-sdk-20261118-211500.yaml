component: SDK
kind: Fixed
body: 'An MCP tool result that holds its records in lists under its own keys, such as `{"files": [...]}` or `{"sections": [...], "section_groups": [...]}`, now yields one cited reference per titled record that has an http(s) link, instead of one untitled reference with no link. The same holds for a `nodes` list inside a wrapper, so an Atlassian Jira or Confluence search now cites each issue or page with its browser link, also under a reference mapping whose list path points at the wrapper. Records from such lists without a title or a link are skipped, and a result with no such record still yields one untitled reference. `webLink`/`web_link` is taken before other URLs such as a meeting join link, and a record whose own web link is empty gets no link rather than an unrelated URL. Records that share a title but have different links, such as instances of one recurring event, are cited separately. `display_name` now titles a record that has a link.'
