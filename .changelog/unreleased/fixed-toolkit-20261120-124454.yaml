component: Toolkit
kind: Fixed
body: The PDF rules in the default Code Execution (`code_interpreter`) system prompts now cover wide tables, escaping and regeneration. Every table cell must be a `Paragraph` in the TrueType style, so a wide table wraps instead of running off the page. Text and URLs go through `xml.sax.saxutils.escape`, so `&` no longer prints a stray `;`. Each build uses a fresh story list, so a regenerated PDF is no longer empty. The self-check now also asserts that the PDF has pages and text.
