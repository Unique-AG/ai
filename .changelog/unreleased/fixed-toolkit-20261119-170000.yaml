component: Toolkit
kind: Fixed
body: 'An MCP tool result without `unique.app/reference` metadata is now citable in Unique AI. `MCPToolWrapper` splits it with the same extractor `unique-cli mcp` uses, so each titled record becomes a `[sourceN]` source with its own web link, and a result with no titled record becomes one source named after the tool. The tool''s reference mapping is applied first. Fields outside the records, such as a page token, stay visible to the model in one extra source. Error and image results are unchanged.'
