body: Project chats include the project's memory, built nightly from the user's earlier chats in the project, in the system prompt under "What I know about this project". Applies to chats in a project (Projects enabled for the company) once a memory exists; a failed read runs the turn without it. Spaces with a custom system prompt template need `{{ project_memory }}` added to show it.
