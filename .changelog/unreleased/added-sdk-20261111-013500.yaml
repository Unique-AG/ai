body: '`AgenticTable.set_activity` accepts an optional `kind` (`ActivityKind`, currently `METADATA_TAGS_SKIPPED`) that marks a notice the client tells apart from other activities. Omit it for ordinary activities; servers that predate the field reject it with a 400.'
