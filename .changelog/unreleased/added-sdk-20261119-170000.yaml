component: SDK
kind: Added
body: '`unique_sdk.utils.mcp_citations.extract_mcp_citation_items` returns the citable records of an MCP tool result (title, link, details and text), taking the result as a wire dict or an object. `unique-cli mcp` now calls it, so the CLI uses the shared extractor and now keeps internal `unique://content/<id>` links as citation URLs, alongside http(s) links.'
